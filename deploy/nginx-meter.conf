# nginx vhost for meter.langecornu.com — reverse-proxies to the Node
# server (default port 8787), which serves the built frontend, the REST
# API, and the WebSocket endpoint from one process.
#
# Install:
#   sudo cp deploy/nginx-meter.conf /etc/nginx/sites-available/meter
#   sudo ln -s /etc/nginx/sites-available/meter /etc/nginx/sites-enabled/meter
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: the existing langecornu.com vhost terminates TLS with a Cloudflare
# origin cert (DNS proxied through Cloudflare).
# Do the same here for consistency: issue a Cloudflare origin cert for
# meter.langecornu.com, point DNS at this VM's IP with the Cloudflare proxy
# (orange cloud) on, and drop the cert/key paths in below. If this VM isn't
# behind Cloudflare, swap the ssl_certificate lines for a Let's Encrypt cert
# instead (`certbot --nginx -d meter.langecornu.com`).

server {
    listen 80;
    listen [::]:80;
    server_name meter.langecornu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meter.langecornu.com;
    http2 on;

    ssl_certificate     /etc/ssl/certs/meter-langecornu-cf.crt;
    ssl_certificate_key /etc/ssl/private/meter-langecornu-cf.key;

    access_log /var/log/nginx/meter_access.log;
    error_log  /var/log/nginx/meter_error.log;

    # WebSocket (live data feed) — needs the Upgrade/Connection headers and
    # a long read timeout so idle connections aren't dropped mid-session.
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # REST API + the built frontend, both served by the same Node process.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
